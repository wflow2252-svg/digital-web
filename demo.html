<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign Demo | Digital Web</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="firebase-config.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; background: #020617; overflow: hidden; }
        #loader { 
            position: fixed; inset:0; display: flex; flex-direction: column; align-items:center; justify-content:center;
            background: #020617; color: white; font-family: sans-serif; z-index: 1000; transition: opacity 0.5s ease;
        }
        .spinner { width: 50px; height: 50px; border: 3px solid rgba(255,255,255,0.1); border-top-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <div id="loader">
        <div class="spinner"></div>
        <div style="font-weight: 800; letter-spacing: 2px;">SYNTHESIZING SOVEREIGN DEMO...</div>
    </div>
    <div id="output-container" style="width: 100%; height: 100%;"></div>

    <script>
        async function loadDemo() {
            const urlParams = new URLSearchParams(window.location.search);
            const demoId = urlParams.get('id');
            const output = document.getElementById('output-container');
            const loader = document.getElementById('loader');

            if (!demoId) {
                document.body.innerHTML = '<div style="color:white; text-align:center; padding-top:100px;"><h1>ERROR: 404</h1><p>Demo ID missing. Sovereign Hub cannot locate target.</p></div>';
                return;
            }

            try {
                const db = window.SOVEREIGN_HUB.db;
                const snapshot = await db.ref(`demos/${demoId}`).once('value');
                const data = snapshot.val();

                if (data && data.html) {
                    const iframe = document.createElement('iframe');
                    output.appendChild(iframe);
                    const doc = iframe.contentWindow.document;
                    doc.open();
                    doc.write(data.html);
                    doc.close();
                    
                    // Cleanup loader
                    setTimeout(() => loader.style.opacity = '0', 800);
                    setTimeout(() => loader.style.display = 'none', 1300);
                } else {
                    throw new Error('Demo not found or expired');
                }
            } catch (err) {
                console.error(err);
                document.body.innerHTML = `<div style="color:white; text-align:center; padding-top:100px;"><h1>EXPIRY ALERT</h1><p>${err.message}</p></div>`;
            }
        }

        window.onload = loadDemo;
    </script>
</body>
</html>
