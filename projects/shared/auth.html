<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Access | Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --bg: #0f172a;
            --gray: #64748b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: var(--bg); 
            color: #fff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh;
            background: radial-gradient(circle at top right, rgba(37, 99, 235, 0.1), transparent 50%);
        }
        .auth-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 3rem;
            border-radius: 24px;
            width: 100%;
            max-width: 450px;
            backdrop-filter: blur(20px);
            box-shadow: 0 40px 100px rgba(0,0,0,0.5);
            text-align: center;
        }
        h1 { font-size: 2rem; margin-bottom: 0.5rem; }
        p { color: var(--gray); margin-bottom: 2.5rem; }
        
        .form-group { text-align: left; margin-bottom: 1.5rem; }
        label { display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 0.5rem; color: #aaa; }
        input { 
            width: 100%; 
            padding: 12px 16px; 
            background: rgba(255,255,255,0.05); 
            border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 12px; 
            color: #fff; 
            font-family: inherit;
            transition: 0.3s;
        }
        input:focus { border-color: var(--primary); outline: none; background: rgba(255,255,255,0.08); }
        
        button { 
            width: 100%; 
            padding: 14px; 
            background: var(--primary); 
            color: #fff; 
            border: none; 
            border-radius: 12px; 
            font-weight: 700; 
            font-size: 1rem; 
            cursor: pointer; 
            transition: 0.3s; 
            margin-top: 1rem;
        }
        button:hover { background: #1d4ed8; transform: translateY(-2px); }
        
        .toggle { margin-top: 2rem; font-size: 0.9rem; color: var(--gray); }
        .toggle span { color: var(--primary); font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>
    <div class="auth-card">
        <h1>Welcome Back</h1>
        <p>Enter your credentials to access the project.</p>
        
        <form id="authForm">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" placeholder="name@company.com" required value="demo@digitalweb.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" placeholder="••••••••" required value="password123">
            </div>
            <button type="submit">Sign In to Dashboard</button>
        </form>

        <div class="toggle">Don't have an account? <span>Create one</span></div>
    </div>

    <script>
        document.getElementById('authForm').addEventListener('submit', (e) => {
            e.preventDefault();
            // Simulate successful login
            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('userName', 'Hazem');
            
            // Go back to the referring project
            const referrer = document.referrer;
            if (referrer) {
                window.location.href = referrer;
            } else {
                window.history.back();
            }
        });
    </script>
</body>
</html>
